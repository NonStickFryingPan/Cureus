name: supabase-keep-alive

on:
  schedule:
    - cron: '0 12 * * *'   # daily 12:00 UTC — 7-day pause threshold, 7x margin
  workflow_dispatch:       # manual "run now" button in Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping supabase
        env:
          SUPABASE_URL: https://hgtaufkeujqfckippetz.supabase.co
          ANON_KEY: sb_publishable_1MtgLRKCGXkF5dg7z_kZ0w_SF5iODRC
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "status: $code"
          [ "$code" -eq 200 ] || [ "$code" -eq 401 ] || { echo "might be paused"; exit 1; }
